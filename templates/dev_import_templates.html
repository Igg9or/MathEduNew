<h1>Импорт шаблонов (JSON)</h1>

<p style="color: #666; margin-bottom: 16px;">
    Если задание содержит фото, укажите <code>"photo_url"</code> (ссылка на внешнее фото) или <code>"photo_path"</code> (внутренний путь).<br>
    Также фото можно прикрепить позже — прямо при редактировании урока, кнопкой «📎 Прикрепить фото» у каждого задания.
</p>

<form method="post">
    <textarea name="json"
              rows="25"
              style="width:100%; font-family: monospace;"
              placeholder='[{"textbook_id":1,"name":"task_01","question_template":"...","answer_template":"...","answer_type":"numeric","parameters":{},"photo_url":"https://example.com/img.jpg"}]'></textarea>

    <button type="submit">Импортировать</button>
</form>

{% if result %}
  <p class="{{ 'success' if result.ok else 'error' }}">
      {{ result.msg }}
  </p>
{% endif %}
