<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Платформа урока. СОШ №62 - Авторизация</title>

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <!-- ================= VIDEO INTRO ================= -->
   <div id="intro-overlay">
    <div class="intro-bg">
        <video
            id="intro-video"
            src="{{ url_for('static', filename='video/intro.mp4') }}"
            autoplay
            muted
            playsinline
        ></video>
    </div>

    <div class="intro-fade"></div>
</div>
    <!-- ================================================= -->

    <!-- ================= AUTH ================= -->
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>Математическая платформа</h1>
                <p>Система интерактивного обучения математике</p>
            </div>

            <form id="loginForm" method="POST" action="{{ url_for('login') }}">
                {% if error %}
                <div class="alert alert-error">{{ error }}</div>
                {% endif %}

                <div class="form-group">
                    <label for="username">Имя пользователя</label>
                    <input type="text" id="username" name="username" required>
                </div>

                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <button type="submit" class="btn btn-primary">Войти</button>
            </form>

            <!-- ===== Вход в урок по коду ===== -->

<div style="
margin-top:25px;
padding-top:20px;
border-top:1px solid #e5e5e5;
text-align:center;
">

<h3 style="margin-bottom:10px">Войти в урок</h3>

<input
type="text"
id="lessonCodeInput"
placeholder="Введите код урока"
style="
width:100%;
padding:10px;
border:1px solid #ccc;
border-radius:6px;
margin-bottom:10px;
font-size:16px;
"
/>

<button id="joinLessonBtn" class="btn btn-secondary" style="width:100%">
Войти по коду
</button>

</div>

            <div class="auth-footer">
                <p>Нет аккаунта? Обратитесь к администратору</p>
            </div>
        </div>
    </div>
    <!-- ======================================== -->

    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>

    <script>

const joinBtn = document.getElementById("joinLessonBtn")

if(joinBtn){

joinBtn.onclick = () => {

const code = document.getElementById("lessonCodeInput").value.trim()

if(!code){
alert("Введите код урока")
return
}

window.location.href = "/join/" + code

}

}

</script>

</body>
</html>
