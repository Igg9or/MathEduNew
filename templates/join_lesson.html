<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Вход в урок</title>

<style>

body{
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:#f2f4f8;
}

.card{
background:white;
padding:30px;
border-radius:12px;
box-shadow:0 5px 20px rgba(0,0,0,0.1);
width:520px;
text-align:center;
}

input{
width:100%;
padding:10px;
margin-top:10px;
margin-bottom:20px;
font-size:16px;
}

button{
width:100%;
padding:12px;
font-size:16px;
background:#4f6df5;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
}

.classroom{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
margin-bottom:20px;
}

.column{
border:1px solid #ddd;
border-radius:8px;
padding:10px;
background:#fafafa;
}

.column-title{
font-weight:bold;
margin-bottom:10px;
}

.desk{
display:flex;
justify-content:center;
gap:5px;
margin-bottom:6px;
}

.seat{
width:32px;
height:32px;
border-radius:6px;
background:#e0e3ef;
cursor:pointer;
display:flex;
align-items:center;
justify-content:center;
font-size:12px;
}

.seat.selected{
background:#4f6df5;
color:white;
}

</style>

</head>

<body>

<div class="card">

<h2>Вход в урок</h2>

<form method="POST">

<input
type="text"
name="full_name"
placeholder="Введите ФИО"
required
>

<h3>Выберите своё место</h3>

<input type="hidden" name="seat_row" id="seat_row">
<input type="hidden" name="seat_col" id="seat_col">

<div class="classroom" id="classroom"></div>

<button type="submit">
Начать урок
</button>

</form>

</div>

<script>

const classroom = document.getElementById("classroom")

const rows = 5
const cols = 3

let selected = null

for(let col=0; col<cols; col++){

    const column = document.createElement("div")
    column.className="column"

    const title=document.createElement("div")
    title.className="column-title"

    if(col==0) title.innerText="Левый ряд"
    if(col==1) title.innerText="Центральный ряд"
    if(col==2) title.innerText="Правый ряд"

    column.appendChild(title)

    for(let desk=0; desk<rows; desk++){

        const deskDiv=document.createElement("div")
        deskDiv.className="desk"

        for(let side=0; side<2; side++){

            const seat=document.createElement("div")
            seat.className="seat"

            seat.innerText=desk+1

            seat.onclick=()=>{

                document.querySelectorAll(".seat")
                    .forEach(s=>s.classList.remove("selected"))

                seat.classList.add("selected")

                const seat_row = col
                const seat_col = desk*2 + side

                document.getElementById("seat_row").value=seat_row
                document.getElementById("seat_col").value=seat_col

            }

            deskDiv.appendChild(seat)

        }

        column.appendChild(deskDiv)

    }

    classroom.appendChild(column)

}

</script>

</body>
</html>
